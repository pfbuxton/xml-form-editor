[package]
name = "xml-form-editor-ui"
description = "The form editor's webview: a Leptos app compiled to WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Must match the version of wasm-bindgen-cli that `npm run build:webview` runs.
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Document", "Element", "EventTarget", "FocusEvent", "HtmlInputElement", "HtmlTableElement", "KeyboardEvent", "MessageEvent", "Node", "Window", "console"] }
xml-form-editor-core = { path = "../xml-form-editor-core" }
